<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoParts TMA - Магазин автозапчастей</title>
    
    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Основные стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Фоновые элементы -->
    <div class="bg-overlay"></div>
    <div class="bg-particles" id="particles"></div>
    
    <div class="app-wrapper">
        <!-- Шапка сайта -->
        <header class="app-header">
            <div class="header-top">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-car"></i>
                        <span class="logo-glow"></span>
                    </div>
                    <div class="logo-text">
                        <h1>Auto<span>Parts</span></h1>
                        <span class="logo-slogan">Запчасти для твоего авто</span>
                    </div>
                </div>
                
                <div class="header-actions">
                    <div class="cart-icon-wrapper" id="cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-badge" id="cart-count">0</span>
                        <span class="cart-tooltip">Корзина</span>
                    </div>
                    
                    <div class="user-avatar-wrapper" id="user-menu">
                        <div class="user-avatar" id="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="user-dropdown" id="user-dropdown">
                            <div class="user-info">
                                <div class="user-name" id="user-name">Гость</div>
                                <div class="user-email" id="user-email"></div>
                            </div>
                            <div class="dropdown-menu">
                                <a href="#" onclick="navigateTo('profile')"><i class="fas fa-user-circle"></i> Мой профиль</a>
                                <a href="#" onclick="navigateTo('orders')"><i class="fas fa-clipboard-list"></i> Мои заказы</a>
                                <a href="#" onclick="navigateTo('favorites')"><i class="fas fa-heart"></i> Избранное</a>
                                <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Выйти</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="header-search">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="Поиск запчастей по названию, артикулу или VIN..." autocomplete="off">
                    <button class="search-btn" id="search-btn">
                        <span>Найти</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                <div class="search-suggestions" id="search-suggestions"></div>
            </div>
            
            <div class="header-categories">
                <div class="categories-scroll">
                    <button class="category-chip active" data-category="all">Все товары</button>
                    <button class="category-chip" data-category="engine">Двигатель</button>
                    <button class="category-chip" data-category="brakes">Тормоза</button>
                    <button class="category-chip" data-category="suspension">Подвеска</button>
                    <button class="category-chip" data-category="electrical">Электрика</button>
                    <button class="category-chip" data-category="body">Кузов</button>
                    <button class="category-chip" data-category="exhaust">Выхлоп</button>
                    <button class="category-chip" data-category="oil">Масла</button>
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content" id="main-content">
            <!-- Контент будет загружаться динамически через JavaScript -->
            <div id="catalog-page" class="page active-page"></div>
            <div id="categories-page" class="page"></div>
            <div id="cart-page" class="page"></div>
            <div id="orders-page" class="page"></div>
            <div id="profile-page" class="page"></div>
            <div id="favorites-page" class="page"></div>
            <div id="product-page" class="page"></div>
            <div id="checkout-page" class="page"></div>
        </main>
        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="catalog">
                <i class="fas fa-th-large"></i>
                <span>Каталог</span>
            </button>
            <button class="nav-item" data-page="categories">
                <i class="fas fa-list"></i>
                <span>Категории</span>
            </button>
            <button class="nav-item" data-page="cart">
                <i class="fas fa-shopping-cart"></i>
                <span>Корзина</span>
                <span class="nav-badge" id="nav-cart-count">0</span>
            </button>
            <button class="nav-item" data-page="favorites">
                <i class="fas fa-heart"></i>
                <span>Избранное</span>
                <span class="nav-badge" id="nav-favorites-count">0</span>
            </button>
            <button class="nav-item" data-page="profile">
                <i class="fas fa-user"></i>
                <span>Профиль</span>
            </button>
        </nav>

        <!-- Кнопка быстрого просмотра корзины -->
        <div class="quick-cart" id="quick-cart">
            <div class="quick-cart-content">
                <i class="fas fa-shopping-cart"></i>
                <span class="quick-cart-total" id="quick-cart-total">0 ₽</span>
            </div>
        </div>

        <!-- Модальное окно быстрого просмотра товара -->
        <div class="modal" id="quick-view-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content" id="quick-view-content">
                <button class="modal-close"><i class="fas fa-times"></i></button>
                <!-- Контент загружается динамически -->
            </div>
        </div>

        <!-- Модальное окно подтверждения -->
        <div class="modal" id="confirm-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content modal-small">
                <h3 id="confirm-title">Подтверждение</h3>
                <p id="confirm-message">Вы уверены?</p>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeModal('confirm-modal')">Отмена</button>
                    <button class="btn-primary" id="confirm-action">Подтвердить</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно оплаты -->
        <div class="modal" id="payment-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal('payment-modal')"><i class="fas fa-times"></i></button>
                <h2><i class="fas fa-credit-card"></i> Оплата заказа</h2>
                <div class="payment-methods">
                    <label class="payment-method">
                        <input type="radio" name="payment" value="card" checked>
                        <i class="fas fa-credit-card"></i>
                        <span>Банковская карта</span>
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment" value="sbp">
                        <i class="fas fa-qrcode"></i>
                        <span>СБП</span>
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment" value="cash">
                        <i class="fas fa-money-bill"></i>
                        <span>Наличные</span>
                    </label>
                </div>
                <div class="payment-details" id="payment-details">
                    <div class="payment-summary">
                        <div class="summary-row">
                            <span>Сумма заказа:</span>
                            <span id="payment-amount">0 ₽</span>
                        </div>
                        <div class="summary-row">
                            <span>Комиссия:</span>
                            <span>0 ₽</span>
                        </div>
                        <div class="summary-row total">
                            <span>Итого к оплате:</span>
                            <span id="payment-total">0 ₽</span>
                        </div>
                    </div>
                </div>
                <button class="btn-primary btn-large" onclick="processPayment()">
                    <i class="fas fa-lock"></i> Оплатить
                </button>
            </div>
        </div>

        <!-- Уведомления -->
        <div class="notification-container" id="notification-container"></div>

        <!-- Индикатор загрузки страницы -->
        <div class="page-loader" id="page-loader">
            <div class="loader-content">
                <div class="loader-spinner"></div>
                <div class="loader-text">AutoParts</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
